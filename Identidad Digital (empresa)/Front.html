<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice Digital | Innovación Mágica</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* VARIABLES DE ESTILO FAIRYTΟPIA */
        :root {
            --rosa-brillante: #ff85a1;
            --rosa-pastel: #fbb1bd;
            --lavanda: #e0aaff;
            --azul-cielo: #90e0ef;
            --blanco-nube: #ffffff;
            --texto-morado: #4a306d;
            --fuente-titulo: 'Pacifico', cursive;
            --fuente-cuerpo: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente-cuerpo);
            background: linear-gradient(135deg, #fff5f8 0%, #e7dfff 50%, #d9f2ff 100%);
            color: var(--texto-morado);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* NAVEGACIÓN */
        header {
            padding: 20px 5%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px 40px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(224, 170, 255, 0.2);
        }

        .logo-container {
            font-family: var(--fuente-titulo);
            font-size: 1.8rem;
            color: var(--rosa-brillante);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--texto-morado);
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--rosa-brillante);
            text-shadow: 0 0 10px rgba(255, 133, 161, 0.3);
        }

        /* SECCIÓN HERO */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 80px 10%;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
            z-index: 2;
        }

        .hero-text h1 {
            font-family: var(--fuente-titulo);
            font-size: 4.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff4d6d, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.2rem;
            margin-bottom: 35px;
            color: #6d597a;
            max-width: 450px;
        }

        .btn-magico {
            padding: 18px 40px;
            background: linear-gradient(90deg, var(--rosa-brillante), var(--lavanda));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.4);
            transition: all 0.4s ease;
            display: inline-block;
        }

        .btn-magico:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 30px rgba(189, 147, 249, 0.5);
        }

        /* IMAGEN Y EFECTO MARIPOSA */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-width: 300px;
        }

        .circle-glow {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(144,224,239,0.3) 100%);
            border-radius: 50%;
            position: absolute;
            filter: blur(40px);
            animation: pulse 4s infinite alternate;
        }

        .logo-placeholder {
            width: 250px;
            z-index: 3;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            animation: float 5s ease-in-out infinite;
        }

        /* ANIMACIONES */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(3deg); }
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.6; }
            to { transform: scale(1.2); opacity: 0.9; }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero-text h1 { font-size: 3rem; }
            .navbar { flex-direction: column; gap: 15px; border-radius: 20px; }
            .hero { text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo-container">
                🦋 Índice Digital
            </div>
            <ul class="nav-links">
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Nuestro Equipo</a></li>
                <li><a href="#">K-Libro</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-text">
                <h1>Creatividad sin límites</h1>
                <p>En <strong>Índice Digital</strong>, transformamos líneas de código en experiencias mágicas. Somos los arquitectos detrás de K-Libro.</p>
                <a href="#" class="btn-magico">Ver Proyecto K-Libro</a>
            </div>

            <div class="hero-visual">
                <div class="circle-glow"></div>
                <div class="logo-placeholder">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="fill: var(--rosa-brillante);">
                        <path d="M100,160 C100,160 160,140 180,80 C200,20 120,40 100,70 C80,40 0,20 20,80 C40,140 100,160 100,160 Z" />
                    </svg>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
